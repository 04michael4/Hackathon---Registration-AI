spring.application.name=registration-backend
server.port=${PORT:8080}
spring.mvc.problemdetails.enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AI preference extraction: none (default, returns 503) | dummy (fixed example, no API key) | claude (real API)
app.ai.provider=${AI_PROVIDER:none}

# Claude settings (used only when AI_PROVIDER=claude). Never put a real key in this file.
app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
app.ai.anthropic.timeout=20s
app.ai.anthropic.max-retries=1
app.ai.anthropic.max-tokens=4096

# Course catalog: dummy (AI development only) | database (authoritative PostgreSQL reads)
app.catalog.source=${CATALOG_SOURCE:dummy}

# Used only when CATALOG_SOURCE=database. Schema/data are provisioned separately.
app.catalog.database.url=${DB_URL:}
app.catalog.database.username=${DB_USERNAME:}
app.catalog.database.password=${DB_PASSWORD:}
app.catalog.database.schema=${CATALOG_SCHEMA:cse007_snapshot}

# Schedule search: maximum engine nodes explored per request (positive integer)
scheduling.node-cap=${SCHEDULING_NODE_CAP:200000}
